[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Automated, scope-aware website pentesting toolkit for authorized assessments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dnspython>=2.6",
    "httpx>=0.27",
    "rich>=13.7",
    "textual>=0.86",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools]
packages = ["sentinel", "sentinel.modules"]
package-dir = { "sentinel" = "." }

[tool.setuptools.package-data]
sentinel = ["wordlists/*.txt"]
